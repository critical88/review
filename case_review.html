<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmellBench Case Review</title>
<link rel="stylesheet" href="libs/highlight-github.min.css">
<link rel="stylesheet" type="text/css" href="libs/diff2html.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script type="text/javascript" src="libs/diff2html-ui.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fa;--bg2:#fff;--bg3:#eef1f5;--bd:#d0d7de;--tx:#1f2328;--tx2:#656d76;--ac:#0969da;--gn:#1a7f37;--rd:#cf222e;--og:#9a6700;--pp:#8250df;--side-w:280px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.topbar{position:sticky;top:0;z-index:100;background:var(--bg2);border-bottom:1px solid var(--bd);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.topbar h1{font-size:17px;font-weight:700;background:linear-gradient(135deg,var(--ac),var(--pp));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.sbox{display:flex;align-items:center;gap:6px;flex:1;min-width:200px;max-width:550px}
.sbox input{flex:1;padding:7px 12px;border-radius:7px;background:var(--bg2);border:1px solid var(--bd);color:var(--tx);font-size:13px;font-family:'JetBrains Mono',monospace;outline:none}
.sbox input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(9,105,218,.15)}
.btn{padding:7px 16px;border-radius:7px;border:none;cursor:pointer;font-weight:600;font-size:13px;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-p{background:var(--ac);color:#fff}
.btn-f{background:var(--bg2);border:1px solid var(--bd);color:var(--tx2)}
.btn-f:hover{border-color:var(--ac);color:var(--ac)}
.evs{display:flex;gap:3px}
.evs button{padding:5px 12px;border-radius:5px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);cursor:pointer;font-size:12px}
.evs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.wrap{display:flex;min-height:calc(100vh - 53px)}
.side{width:var(--side-w);min-width:var(--side-w);background:var(--bg2);border-right:1px solid var(--bd);overflow-y:auto;max-height:calc(100vh - 53px);position:sticky;top:53px;transition:width .25s,min-width .25s,opacity .25s}
.side.collapsed{width:0;min-width:0;overflow:hidden;opacity:0}
.side-h{padding:14px;border-bottom:1px solid var(--bd);font-weight:600;font-size:13px;color:var(--tx2);display:flex;justify-content:space-between;align-items:center}
.side-h button{background:none;border:none;cursor:pointer;font-size:16px;color:var(--tx2);padding:0 4px}
.side-h button:hover{color:var(--tx)}
.ti{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--bd);transition:background .15s;display:flex;align-items:flex-start;gap:8px}
.ti:hover{background:var(--bg3)}
.ti.on{background:var(--bg3);border-left:3px solid var(--ac)}
.ti.done{opacity:.55}
.ti.done .tid{text-decoration:line-through;color:var(--tx2)}
.ti .tc{margin-top:3px;accent-color:var(--gn);cursor:pointer;flex-shrink:0}
.ti .tc:hover{transform:scale(1.2)}
.ti .tbody{flex:1;min-width:0}
.ti .tid{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ac);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti .tinf{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:10px;padding:1px 7px;border-radius:8px;font-weight:500}
.tag.r{background:#ddf4ff;color:var(--ac)}.tag.s{background:#fbefff;color:var(--pp)}
.tag.e{background:#dafbe1;color:var(--gn)}.tag.m{background:#fff8c5;color:var(--og)}.tag.h{background:#ffebe9;color:var(--rd)}
.side-toggle{width:24px;min-width:24px;background:var(--bg2);border-right:1px solid var(--bd);display:flex;align-items:flex-start;justify-content:center;padding-top:12px;cursor:pointer;color:var(--tx2);font-size:14px;user-select:none}
.side-toggle:hover{background:var(--bg3);color:var(--tx)}
.main{flex:1;padding:20px;overflow-y:auto;max-height:calc(100vh - 53px)}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;color:var(--tx2);text-align:center}
.welcome .ico{font-size:52px;margin-bottom:16px}
.welcome h2{font-size:22px;margin-bottom:8px;color:var(--tx)}
.welcome p{font-size:14px;margin-bottom:24px;max-width:420px;line-height:1.6}
.welcome .note{font-size:12px;color:var(--tx2);margin-top:8px;opacity:.7}
.mp{background:var(--bg2);border-radius:10px;border:1px solid var(--bd);margin-bottom:16px;overflow:hidden}
.mp-h{padding:14px 18px;border-bottom:1px solid var(--bd);font-size:15px;font-weight:600}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px;background:var(--bd)}
.mc{background:var(--bg2);padding:8px 14px}
.mc .lb{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:1px}
.mc .vl{font-size:13px;font-weight:500;font-family:'JetBrains Mono',monospace;word-break:break-all}
.sc{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.scd{background:var(--bg2);border-radius:8px;border:1px solid var(--bd);padding:14px 18px;min-width:120px;text-align:center}
.scd .sl{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.scd .sv{font-size:26px;font-weight:700;font-family:'JetBrains Mono',monospace}
.gn{color:var(--gn)}.og{color:var(--og)}.rd{color:var(--rd)}
/* Sticky header — one unified block */
.sticky-header{position:sticky;top:-20px;z-index:50;background:var(--bg)}
.tabs{display:flex;border-bottom:2px solid var(--bd);padding-top:4px}
.tab{padding:8px 18px;cursor:pointer;font-size:13px;font-weight:500;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab:hover{color:var(--tx)}.tab.on{color:var(--ac);border-bottom-color:var(--ac)}
.to{background:var(--bg2);border-radius:10px;border:1px solid var(--bd);overflow:hidden;margin-bottom:16px}
.to-h{padding:10px 18px;border-bottom:1px solid var(--bd);font-weight:600;font-size:13px}
.to pre{padding:14px 18px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.5;overflow-x:auto;color:var(--tx2);max-height:350px;overflow-y:auto;white-space:pre-wrap;background:var(--bg)}
/* Diff2HTML overrides */
.d2h-wrapper{background:transparent!important}
.d2h-code-line,.d2h-code-side-line,.d2h-code-line-ctn{box-sizing:content-box!important}
.d2h-file-header{background:var(--bg3)!important;border-color:var(--bd)!important}
.d2h-file-name{color:var(--tx)!important;font-weight:600!important}
.d2h-file-stats{color:var(--tx2)!important}
.d2h-tag{display:none}
.d2h-file-wrapper{position:relative!important;margin:0!important;border:0!important;border-bottom:1px solid var(--bd)!important;border-radius:0!important}
.d2h-file-wrapper:last-child{border-bottom:none!important}
.d2h-del{background:rgba(207,34,46,.1)!important}
.d2h-ins{background:rgba(26,127,55,.1)!important}
.d2h-info{background:var(--bg3)!important;color:var(--tx2)!important}
/* File toolbar */
.ff-toolbar{padding:6px 0 0;display:flex;flex-direction:column}
.ff-tabs{display:flex;gap:2px;margin-bottom:6px;flex-wrap:wrap;border-bottom:2px solid var(--bd)}
.ff-tab{padding:5px 12px;cursor:pointer;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.ff-tab:hover{color:var(--tx)}.ff-tab.on{color:var(--ac);border-bottom-color:var(--ac)}
.ff-tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
.dot.added{background:var(--gn)}.dot.deleted{background:var(--rd)}.dot.changed{background:var(--og)}
/* Nav buttons */
.ff-nav{display:flex;gap:4px;margin-bottom:6px;align-items:center;flex:1}
.ff-nav button{padding:3px 10px;border-radius:4px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);cursor:pointer;font-size:11px;font-weight:500;transition:all .15s}
.ff-nav button:hover{border-color:var(--ac);color:var(--ac)}
.ff-nav .ff-nav-count{font-size:11px;color:var(--tx2);font-family:'JetBrains Mono',monospace;padding:0 6px}
/* Judge button in toolbar */
.ff-nav-right{margin-left:auto;display:flex;gap:4px}
.judge-btn{padding:3px 12px;border-radius:4px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);cursor:pointer;font-size:11px;font-weight:600;transition:all .15s}
.judge-btn:hover{border-color:var(--og);color:var(--og)}
.judge-btn.has-data{border-color:var(--og);color:var(--og);background:#fff8c5}
/* Judge drawer (slides from right) */
.judge-drawer{position:fixed;top:0;right:-420px;width:400px;height:100vh;background:var(--bg2);border-left:1px solid var(--bd);box-shadow:-4px 0 16px rgba(0,0,0,.1);z-index:200;transition:right .3s ease;overflow-y:auto}
.judge-drawer.open{right:0}
.judge-drawer-h{position:sticky;top:0;background:var(--bg2);padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;z-index:1}
.judge-drawer-h button{background:none;border:none;cursor:pointer;font-size:20px;color:var(--tx2);padding:0 4px}
.judge-drawer-h button:hover{color:var(--tx)}
.judge-drawer-h button.drawer-copy{font-size:12px;font-weight:600;color:var(--ac);border:1px solid var(--bd);background:var(--bg2);padding:3px 10px;border-radius:5px;display:inline-flex;align-items:center;gap:3px;font-family:inherit}
.judge-drawer-h button.drawer-copy:hover{border-color:var(--ac);background:var(--bg3);color:var(--ac)}
.judge-drawer .jsum{padding:16px 20px;font-size:13px;line-height:1.7;border-bottom:1px solid var(--bd);background:var(--bg3)}
.judge-drawer .rg{display:flex;flex-direction:column}
.judge-drawer .ri{padding:14px 20px;border-bottom:1px solid var(--bd)}.judge-drawer .ri:last-child{border-bottom:none}
.judge-drawer .ri-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.judge-drawer .rn{font-size:13px;font-weight:600}.judge-drawer .rs{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px}
.judge-drawer .rj{font-size:12px;color:var(--tx2);line-height:1.6}
/* Overlay for drawer */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:199;opacity:0;pointer-events:none;transition:opacity .3s}
.drawer-overlay.open{opacity:1;pointer-events:auto}
/* Markdown content in drawer */
.md-body{padding:20px;font-size:13px;line-height:1.7;color:var(--tx)}
.md-body h1{font-size:18px;font-weight:700;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
.md-body h2{font-size:16px;font-weight:700;margin:18px 0 8px}
.md-body h3{font-size:14px;font-weight:600;margin:14px 0 6px}
.md-body h4{font-size:13px;font-weight:600;margin:12px 0 4px}
.md-body p{margin:8px 0}
.md-body ul,.md-body ol{margin:6px 0;padding-left:24px}
.md-body li{margin:3px 0}
.md-body strong{font-weight:600}
.md-body em{font-style:italic}
.md-body code{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--bg3);padding:1px 5px;border-radius:3px}
.md-body pre{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:12px 16px;overflow-x:auto;margin:10px 0}
.md-body pre code{background:none;padding:0;font-size:11px}
.md-body blockquote{border-left:3px solid var(--ac);padding:4px 12px;margin:8px 0;color:var(--tx2);background:var(--bg3);border-radius:0 6px 6px 0}
.md-body hr{border:none;border-top:1px solid var(--bd);margin:16px 0}
.md-body table{border-collapse:collapse;width:100%;margin:8px 0}
.md-body th,.md-body td{border:1px solid var(--bd);padding:6px 10px;text-align:left;font-size:12px}
.md-body th{background:var(--bg3);font-weight:600}
/* Change gutter */
.ff-gutter{position:absolute;right:0;top:0;width:8px;height:100%;pointer-events:none;z-index:2}
.ff-gutter .mk{position:absolute;right:0;width:8px;min-height:2px;border-radius:1px;cursor:pointer;pointer-events:auto;opacity:.7;transition:opacity .15s}
.ff-gutter .mk:hover{opacity:1}
.ff-gutter .mk.add{background:var(--gn)}
.ff-gutter .mk.del{background:var(--rd)}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--tx2)}
</style>
</head>
<body>

<div class="topbar">
  <h1>&#9873; SmellBench Case Review</h1>
  <button class="btn btn-f" onclick="openFolder()">&#128193; Open Folder</button>
  <div class="sbox">
    <input id="si" type="text" placeholder="Enter case-id ..." spellcheck="false">
    <button class="btn btn-p" onclick="load()">Load</button>
    <button class="btn btn-f" onclick="pickResultsFile()" title="导入 JSON，并覆盖当前 evaluator 的评分">&#128194; Import</button>
    <input id="results-import" type="file" accept="application/json,.json" style="display:none" onchange="importResultsFile(event)">
    <button class="btn btn-f" onclick="collectResults()" title="导出当前 evaluator 的全部标注结果 (JSON)">&#128190; Collect</button>
  </div>
  <div class="evs" id="es"></div>
</div>

<div class="wrap">
  <div class="side" id="side">
    <div class="side-h"><span id="sh">Tasks</span><button onclick="toggleSide()" title="Collapse">&#9664;</button></div>
    <div id="tl"></div>
  </div>
  <div class="side-toggle" id="sideToggle" style="display:none" onclick="toggleSide()">&#9654;</div>
  <div class="main">
    <div class="welcome" id="wc">
      <div class="ico">&#128193;</div>
      <h2>Open Evaluation Folder</h2>
      <p>Click <strong>Open Folder</strong> and select the <code>case_review_data</code> directory. All data stays local.</p>
      <button class="btn btn-p" onclick="openFolder()" style="padding:10px 28px;font-size:15px">Select Folder</button>
      <div class="note">Requires Chrome 86+ or Edge 86+.</div>
    </div>
    <div id="tc" style="display:none">
      <div class="mp" id="mp"></div>
      <div class="sc" id="sc"></div>
      <div class="pp-panel" id="pp"></div>
      <div class="sticky-header" id="sticky-header">
        <div class="tabs">
          <div class="tab on" onclick="stab('smell')">Smell Diff</div>
          <div class="tab" onclick="stab('rawsmell')">Raw Smell</div>
          <div class="se-bar" id="sep"></div>
        </div>
        <div class="ff-toolbar" id="ads-toolbar" style="display:none">
          <div class="ff-tabs" id="ads-fft"></div>
          <div class="ff-nav">
            <button onclick="navChange('ads',-1)">&#9650; Prev</button>
            <span class="ff-nav-count" id="ads-nav-count"></span>
            <button onclick="navChange('ads',1)">Next &#9660;</button>
            <span class="ff-nav-right">
              <button class="judge-btn" id="rubric-btn-ads" onclick="openDrawer('solveRubric')" title="本题求解 Rubric (solve_rubrics.json)">&#9878; Rubric</button>
              <button class="judge-btn" id="judge-btn" onclick="openDrawer('judge')" style="display:none">&#9733; Judge</button>
              <button class="judge-btn" id="prompt-btn-ads" onclick="openDrawer('prompt')" style="display:none">&#128196; Prompt</button>
            </span>
          </div>
        </div>
        <div class="ff-toolbar" id="sds-toolbar" style="display:none">
          <div class="ff-tabs" id="sds-fft"></div>
          <div class="ff-nav">
            <button onclick="navChange('sds',-1)">&#9650; Prev</button>
            <span class="ff-nav-count" id="sds-nav-count"></span>
            <button onclick="navChange('sds',1)">Next &#9660;</button>
            <span class="ff-nav-right">
              <button class="judge-btn" id="rubric-btn-sds" onclick="openDrawer('taskRubric')" title="案例评判标准 (v6.2 中文)">&#9878; Rubric</button>
              <button class="judge-btn" id="smelltype-btn-sds" onclick="openDrawer('smellType')" title="本案例的 Smell Type 界定说明">&#128300; Smell Type</button>
              <button class="judge-btn" id="diffdesc-btn-sds" onclick="openDrawer('diffDesc')" title="本案例的 Injection 设计说明 (diff_desc.md)" style="display:none">&#128203; diff_desc</button>
              <button class="judge-btn" id="prompt-btn-sds" onclick="openDrawer('prompt')" style="display:none">&#128196; Prompt</button>
            </span>
          </div>
        </div>
      </div>
      <!-- Content sections -->
      <div id="ads-wrap" style="display:none"><div id="ads"></div></div>
      <div id="sds-wrap" style="display:none"><div id="sds"></div></div>
      <div id="rawsmell-wrap" style="display:none">
        <div class="rs-head"><span class="rs-t">&#128196; Raw Smell Diff</span><button class="rs-copy" onclick="copyRawSmell()" title="一键复制原始 smell.diff 内容">&#128203; 复制</button></div>
        <pre id="rawsmell" class="rs-pre"></pre>
      </div>
    </div>
  </div>
</div>

<!-- Judge Drawer -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="judge-drawer" id="judge-drawer">
  <div class="judge-drawer-h" id="drawer-header"><span>&#9733; Judge Evaluation</span><button onclick="closeDrawer()">&#10005;</button></div>
  <div id="judge-content"></div>
</div>

<script src="vendor/popper.min.js"></script>
<script src="vendor/tippy.min.js"></script>
<script>
// ---- scoring form + tooltip styles (injected at runtime) ----
(function(){const s=document.createElement('style');s.textContent=`
.scoring{font-size:12px;background:var(--bg)}
.sc-head{padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--bd);color:var(--tx2);line-height:1.6}
.sc-summary{padding:8px 16px;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:3px}
.sum-row{font-size:12px;color:var(--tx)}.sum-l{color:var(--tx2);margin-right:6px}.sum-model{color:var(--tx2)}
.sum-row span{color:var(--ac);font-weight:600}.sum-null{color:var(--tx2);font-weight:400}
.sc-group{padding:8px 16px 4px;font-size:12px;font-weight:700;color:var(--ac);border-top:1px solid var(--bd);background:var(--bg3)}
.score-tbl{width:100%;border-collapse:collapse}
.score-tbl th{font-size:10px;text-transform:uppercase;color:var(--tx2);text-align:left;padding:6px 10px;border-bottom:1px solid var(--bd);background:var(--bg2)}
.score-tbl td{padding:7px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.th-model,.td-model{text-align:center;width:96px;white-space:nowrap}.th-inp,.td-inp{width:160px}
.td-dim{width:auto}.dim-n{font-weight:600;color:var(--tx)}.dim-en{font-size:10px;color:var(--tx2)}
.mchip{display:inline-block;min-width:22px;padding:1px 6px;border-radius:3px;font-weight:600;color:#fff}.mchip.gn{background:#0a7}.mchip.og{background:#b80}.mchip.rd{background:#b00}
.score-in{width:56px;padding:4px 6px;border:1px solid var(--bd);border-radius:4px;background:var(--bg2);color:var(--tx);font-size:12px;text-align:center}
.score-in:focus{outline:none;border-color:var(--ac)}.score-in.err{border-color:#b00;background:#fee}
.qmark{position:relative;display:inline-block;margin-left:8px;width:15px;height:15px;line-height:15px;text-align:center;border-radius:50%;background:var(--bg3);color:var(--tx2);font-size:10px;cursor:help;vertical-align:middle;user-select:none}
.qmark:hover{background:var(--ac);color:#fff}
/* Tippy tooltip theme (matches the case_review dark UI) */
.tippy-box[data-theme~=smellbench]{background:var(--bg);border:1px solid var(--bd);color:var(--tx);box-shadow:0 6px 22px rgba(0,0,0,.3);font-size:12px;line-height:1.55}
.tippy-box[data-theme~=smellbench]>.tippy-content{padding:10px 12px;max-width:460px;max-height:70vh;overflow:auto}
.tippy-box[data-theme~=smellbench] .tip-t{font-weight:700;color:var(--ac);margin-bottom:4px}.tippy-box[data-theme~=smellbench] .tip-w{color:var(--tx2);font-weight:400}
.tippy-box[data-theme~=smellbench] .tip-e{color:var(--tx);margin-bottom:6px;padding-bottom:6px;border-bottom:1px dashed var(--bd);white-space:normal;overflow-wrap:break-word;word-wrap:break-word}
.tippy-box[data-theme~=smellbench] .tip-r{color:var(--tx2)}.tippy-box[data-theme~=smellbench] .tip-r b{color:var(--tx)}

let root=null,evIds=[],curEv=1,curTrialName=null,curTaskId=null,indexCache={},directEvMode=false,sideOpen=true,curMeta={};
let judgeFull={},promptMd='',diffDescMd='',solveRubric={},smellMeta={entries:[],ruleId:'',ruleDesc:''},curEntryIdx=0;
let rubricZh={};
// evaluator scoring state: evalScores["evId::trial"] = { quality:{dim:n}, difficulty:{dim:n} }
let evalScores={};
const SCORES_KEY='caseReviewScores';
let secState={
  ads:{diff:'',srcs:{},files:[],curFile:null,srcDir:'source_smelly',navIdx:-1},
  sds:{diff:'',srcs:{},files:[],curFile:null,srcDir:'source_clean',navIdx:-1}
};

// ---- IndexedDB persistence (separate key from review.html) ----
const IDB_NAME='smellbench',IDB_STORE='handles',IDB_KEY='caseReviewRoot',DONE_KEY='caseReviewDoneTasks';
function idbOpen(){return new Promise((ok,no)=>{const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=e=>e.target.result.createObjectStore(IDB_STORE);r.onsuccess=e=>ok(e.target.result);r.onerror=e=>no(e.target.error);})}
async function idbSave(handle){const db=await idbOpen();return new Promise((ok,no)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(handle,IDB_KEY);tx.oncomplete=ok;tx.onerror=e=>no(e.target.error);})}
async function idbLoad(){const db=await idbOpen();return new Promise((ok,no)=>{const tx=db.transaction(IDB_STORE,'readonly');const r=tx.objectStore(IDB_STORE).get(IDB_KEY);r.onsuccess=()=>ok(r.result);r.onerror=e=>no(e.target.error);})}

// ---- Done tasks persistence ----
let doneTasks=new Set();
async function loadDoneTasks(){try{const db=await idbOpen();return new Promise((ok,no)=>{const tx=db.transaction(IDB_STORE,'readonly');const r=tx.objectStore(IDB_STORE).get(DONE_KEY);r.onsuccess=()=>{if(r.result)doneTasks=new Set(r.result);ok();};r.onerror=e=>no(e.target.error);});}catch(e){}}
async function saveDoneTasks(){try{const db=await idbOpen();return new Promise((ok,no)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(Array.from(doneTasks),DONE_KEY);tx.oncomplete=ok;tx.onerror=e=>no(e.target.error);});}catch(e){}}
function toggleDone(key,e){e.stopPropagation();/* checkbox is auto-driven by scoring completeness; ignore manual toggle */}
function doneKey(ev,name){return scoreKey(ev,name);}
function scoreComplete(s){if(!s||!rubricZh.quality||!rubricZh.difficulty)return false;return Object.keys(rubricZh.quality.dimensions).every(k=>s.quality&&s.quality[k]!=null)&&Object.keys(rubricZh.difficulty.dimensions).every(k=>s.difficulty&&s.difficulty[k]!=null);}
function rebuildDoneFromScores(){doneTasks=new Set(Object.keys(evalScores).filter(k=>scoreComplete(evalScores[k])));saveDoneTasks();}
function updateDoneUI(){let migrated=false;document.querySelectorAll('.ti[data-trial]').forEach(el=>{const name=el.getAttribute('data-trial');migrated=ensureScoreFor(curEv,name)||migrated;const key=doneKey(curEv,name),completed=scoreComplete(evalScores[key]);if(completed)doneTasks.add(key);else doneTasks.delete(key);const cb=el.querySelector('.tc');if(cb)cb.checked=completed;el.classList.toggle('done',completed);});if(migrated)saveEvalScores();}

// ---- evaluator scores persistence ----
async function loadEvalScores(){try{const db=await idbOpen();return new Promise((ok,no)=>{const tx=db.transaction(IDB_STORE,'readonly');const r=tx.objectStore(IDB_STORE).get(SCORES_KEY);r.onsuccess=()=>{if(r.result)evalScores=r.result;ok();};r.onerror=e=>no(e.target.error);});}catch(e){}}
async function saveEvalScores(){try{const db=await idbOpen();return new Promise((ok,no)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(evalScores,SCORES_KEY);tx.oncomplete=ok;tx.onerror=e=>no(e.target.error);});}catch(e){}}
function scoreKey(ev,name){return ev+'::'+name;}
function scoreHasAny(s){return !!(s&&((s.quality&&Object.keys(s.quality).length)||(s.difficulty&&Object.keys(s.difficulty).length)));}
function fallbackScore(name,excludeKey){
  const old=evalScores[name];return name!==excludeKey&&scoreHasAny(old)?old:null;
}
function ensureScoreFor(ev,name){const k=scoreKey(ev,name);if(scoreHasAny(evalScores[k]))return false;const old=fallbackScore(name,k);if(!old)return false;evalScores[k]=JSON.parse(JSON.stringify(old));return true;}
function getScore(gk,dk){const s=evalScores[scoreKey(curEv,curTrialName)];return s&&s[gk]&&s[gk][dk]!=null?s[gk][dk]:null;}
function setScore(gk,dk,v){const current=scoreKey(curEv,curTrialName);ensureScoreFor(curEv,curTrialName);const keys=new Set([current]);if(scoreHasAny(evalScores[curTrialName]))keys.add(curTrialName);const now=Date.now();for(const k of keys){if(!evalScores[k])evalScores[k]={quality:{},difficulty:{}};if(!evalScores[k][gk])evalScores[k][gk]={};if(v==null)delete evalScores[k][gk][dk];else evalScores[k][gk][dk]=v;evalScores[k]._updated_at=now;}saveEvalScores();}
function allDimsScored(){const s=evalScores[scoreKey(curEv,curTrialName)];if(!s)return false;const q=s.quality||{},d=s.difficulty||{};if(!rubricZh.quality||!rubricZh.difficulty)return false;const all=(group)=>Object.keys(rubricZh[group].dimensions).every(k=>group==='quality'?q[k]!=null:d[k]!=null);return all('quality')&&all('difficulty');}
function syncDoneFromScores(){if(!curTrialName)return;const key=doneKey(curEv,curTrialName);const nowDone=allDimsScored();if(nowDone)doneTasks.add(key);else doneTasks.delete(key);saveDoneTasks();updateDoneUI();updateFab();}
function evaluatorScore100(group){const s=evalScores[scoreKey(curEv,curTrialName)];if(!s||!s[group]||!rubricZh[group])return null;let tot=0,all=true;for(const [dk,dm] of Object.entries(rubricZh[group].dimensions)){const v=s[group][dk];if(v==null){all=false;continue;}tot+=dm.weight*v/5;}return all?Math.round(tot):null;}

function toggleSide(){
  const s=document.getElementById('side'),t=document.getElementById('sideToggle');
  if(sideOpen){s.classList.add('collapsed');t.style.display='flex';}
  else{s.classList.remove('collapsed');t.style.display='none';}
  sideOpen=!sideOpen;
}

async function openFolder(presetHandle){
  if(presetHandle){root=presetHandle;}
  else{try{root=await window.showDirectoryPicker({mode:'read'});}catch(e){if(e.name!=='AbortError')alert('Failed: '+e.message);return;}}
  let evDir,isDirect=false;
  if(root.name.startsWith('evaluator_')){isDirect=true;evDir=root;directEvMode=true;}
  else{
    try{evDir=await root.getDirectoryHandle('evaluators');}
    catch{
      let ok=false;try{for await(const e of root.values())if(e.kind==='directory'&&e.name.startsWith('evaluator_')){ok=true;break;}}catch{}
      if(ok){isDirect=true;evDir=root;directEvMode=true;}
      else{alert('Invalid folder. Please select the case_review_data directory.');return;}
    }
  }
  const evs=[];for await(const e of evDir.values())if(e.kind==='directory'&&e.name.startsWith('evaluator_'))evs.push(e.name.replace('evaluator_',''));
  evIds=evs.sort((a,b)=>+a-+b);
  if(!evIds.length){alert('No evaluator folders found.');return;}
  const es=document.getElementById('es');es.innerHTML='';
  evIds.forEach(id=>{const b=document.createElement('button');b.textContent='E'+id;if(+id===1)b.classList.add('on');b.onclick=()=>selEv(+id);es.appendChild(b);});
  await loadDoneTasks();await loadEvalScores();await loadRubricZh();rebuildDoneFromScores();await loadIndex(1);
  document.getElementById('wc').style.display='none';document.getElementById('tc').style.display='block';
  document.getElementById('si').addEventListener('keydown',e=>{if(e.key==='Enter')load();});
  try{await idbSave(root);}catch(e){console.warn('IDB save failed:',e);}
}

async function autoLoad(){
  try{
    const handle=await idbLoad();
    if(!handle)return;
    const perm=await handle.queryPermission({mode:'read'});
    if(perm==='granted'){await openFolder(handle);return;}
    document.getElementById('wc').innerHTML=
      '<div class="ico">&#128193;</div><h2>Welcome Back</h2>'+
      '<p>Click below to re-access your last folder.</p>'+
      '<button class="btn btn-p" onclick="reGrant()" style="padding:10px 28px;font-size:15px">Open Last Folder</button>'+
      '<div class="note" style="margin-top:12px">Or click <strong>Open Folder</strong> to choose a different one.</div>';
  }catch(e){console.warn('Auto-load failed:',e);}
}
async function reGrant(){try{const h=await idbLoad();if(!h){openFolder();return;}const p=await h.requestPermission({mode:'read'});if(p==='granted')await openFolder(h);else openFolder();}catch(e){openFolder();}}

autoLoad();

async function loadRubricZh(){if(rubricZh.quality)return;try{rubricZh=JSON.parse(await rf(['rubric_zh.json']));}catch(e){console.warn('No rubric_zh.json:',e);rubricZh={};}}

async function loadIndex(evId){
  if(!indexCache[evId]){try{indexCache[evId]=JSON.parse(await rf(evPath(evId,'index.json')));}catch{indexCache[evId]={evaluator_id:evId,num_tasks:0,num_trials:0,trials:[],tasks:[]};}}
  buildList(evId);
}

function buildList(evId){
  const idx=indexCache[evId]||{},trials=idx.trials||[],tasks=idx.tasks||[];
  const trialList=trials.length?trials:tasks.map(t=>({trial_name:t.task_id,task_id:t.task_id,repo:t.repo,smell_type:t.smell_type,difficulty:t.difficulty,final_reward:null,model:null,agent_name:null}));
  document.getElementById('sh').textContent='Cases ('+trialList.length+')';
  const list=document.getElementById('tl');list.innerHTML='';
  trialList.sort((a,b)=>a.task_id.localeCompare(b.task_id)||((b.final_reward||0)-(a.final_reward||0)));
  let migrated=false;
  trialList.forEach(t=>{
    const dc=t.difficulty==='easy'?'e':t.difficulty==='medium'?'m':t.difficulty==='hard'?'h':'';
    migrated=ensureScoreFor(evId,t.trial_name)||migrated;
    const key=doneKey(evId,t.trial_name),completed=scoreComplete(evalScores[key]);if(completed)doneTasks.add(key);else doneTasks.delete(key);
    const d=document.createElement('div');d.className='ti'+(t.trial_name===curTrialName?' on':'')+(completed?' done':'');
    d.setAttribute('data-trial',t.trial_name);
    d.innerHTML='<input type="checkbox" class="tc"'+(completed?' checked':'')+'>'+
      '<div class="tbody"><div class="tid" title="'+esc(t.trial_name)+'">'+esc(t.trial_name)+'</div>'+
      '<div class="tinf">'+
        (t.language?'<span class="tag" style="background:#eafaea;color:#0a7">'+esc(t.language)+'</span>':'')+
        '<span class="tag s">'+esc(t.smell_type||'?')+'</span>'+
        (dc?'<span class="tag '+dc+'">'+esc(t.difficulty||'?')+'</span>':'')+
        (t.prompt_mode?'<span class="tag" style="background:#eaeefe;color:var(--ac)">'+esc(t.prompt_mode)+'</span>':'')+
        (t.final_reward!=null?'<span class="tag" style="background:#eaeefe;color:var(--ac)">Q '+t.final_reward.toFixed(0)+'</span>':'')+
      '</div></div>';
    d.onclick=(e)=>{if(e.target.classList.contains('tc'))return;document.getElementById('si').value=t.trial_name;load(evId);};
    list.appendChild(d);
  });
  if(migrated){saveEvalScores();saveDoneTasks();}
}

function selEv(id){curEv=id;curTrialName=null;curTaskId=null;closeScoringModal();const fab=document.getElementById('score-fab');if(fab)fab.style.display='none';document.querySelectorAll('.evs button').forEach((b,i)=>b.classList.toggle('on',evIds[i]==id));loadIndex(id);}

async function load(preferredEv=curEv){
  const input=document.getElementById('si').value.trim();if(!input||!root)return;
  let foundEv=null,matchedTrial=null;
  // A trial can intentionally appear under multiple evaluators. Search the
  // evaluator whose list was clicked first, otherwise duplicate trial names
  // are silently routed to the lowest-numbered evaluator and scored there.
  const searchEvIds=[String(preferredEv),...evIds.filter(eid=>String(eid)!==String(preferredEv))];
  for(const eid of searchEvIds){
    const trials=indexCache[eid]?.trials||[];
    matchedTrial=trials.find(t=>t.trial_name===input);
    if(matchedTrial){foundEv=eid;break;}
    const byTask=trials.filter(t=>t.task_id===input);
    if(byTask.length){matchedTrial=byTask[0];foundEv=eid;break;}
  }
  if(!foundEv){
    for(const eid of searchEvIds){
      const tasks=indexCache[eid]?.tasks||[];
      if(tasks.some(t=>t.task_id===input)){foundEv=eid;matchedTrial={trial_name:input,task_id:input};break;}
    }
  }
  if(!foundEv||!matchedTrial){alert('Not found: '+input);return;}
  curTrialName=matchedTrial.trial_name;curTaskId=matchedTrial.task_id;curEv=+foundEv;
  if(ensureScoreFor(curEv,curTrialName))saveEvalScores();
  document.querySelectorAll('.evs button').forEach((b,i)=>b.classList.toggle('on',String(evIds[i])===String(foundEv)));
  document.querySelectorAll('.ti[data-trial]').forEach(el=>el.classList.toggle('on',el.getAttribute('data-trial')===curTrialName));
  let meta={},ag='';
  try{meta=JSON.parse(await rf(evPath(foundEv,curTrialName,'meta.json')));}catch{}
  // smell_entries (canonical smell locations) — read from meta and set BEFORE the
  // meta panel / smell-entries panel render, otherwise the first load shows stale data.
  smellMeta={entries:Array.isArray(meta.smell_entries)?meta.smell_entries:[],ruleId:meta.smell_rule_id||'',ruleDesc:meta.smell_rule_desc||''};
  curEntryIdx=0;
  // agent.diff plumbing kept but optional (not displayed for these cases)
  try{ag=await rf(evPath(foundEv,curTrialName,'artifacts','agent.diff'));}catch{try{ag=await rf(evPath(foundEv,curTrialName,'agent.diff'));}catch{}}
  // smell.diff (the injected diff over the clean baseline)
  let sm='';
  try{sm=await rf(evPath(foundEv,curTrialName,'smell.diff'));}catch{}
  // full judge score (Quality + Difficulty dimensions) for the Judge drawer
  judgeFull={};
  try{judgeFull=JSON.parse(await rf(evPath(foundEv,curTrialName,'judge_score.json')));}catch{}
  rMeta(meta);rScores(meta);renderSmellEntries();curMeta=meta;

  // Prompt drawer content: selected prompt markdown
  promptMd='';
  try{promptMd=await rf(evPath(foundEv,curTrialName,'prompt.md'));}catch(e){console.warn('No prompt.md:',e);}
  renderPromptPreview();

  // Solve-rubrics drawer content (Agent Diff tab Rubric): per-case solver rubrics
  solveRubric={};
  try{solveRubric=JSON.parse(await rf(evPath(foundEv,curTrialName,'solve_rubrics.json')));}catch(e){console.warn('No solve_rubrics.json:',e);}

  // diff_desc.md drawer content (Injection design record — describes the modeled smell change)
  diffDescMd='';
  try{diffDescMd=await rf(evPath(foundEv,curTrialName,'diff_desc.md'));}catch(e){console.warn('No diff_desc.md:',e);}

  // Show/hide buttons (reuse the three drawers)
  const jb=document.getElementById('judge-btn');
  const hasJudge=!!(judgeFull.quality&&judgeFull.quality.dimensions);
  if(jb){if(hasJudge){jb.style.display='inline-block';jb.classList.add('has-data');}else{jb.style.display='none';jb.classList.remove('has-data');}}
  // Smell Type button is always available (every case has a smell_type)
  const stb=document.getElementById('smelltype-btn-sds');
  if(stb){stb.style.display='inline-block';}
  const pb1=document.getElementById('prompt-btn-ads'),pb2=document.getElementById('prompt-btn-sds');
  if(promptMd){pb1.style.display='inline-block';pb1.classList.add('has-data');pb2.style.display='inline-block';pb2.classList.add('has-data');}
  else{pb1.style.display='none';pb2.style.display='none';pb1.classList.remove('has-data');pb2.classList.remove('has-data');}
  // diff_desc button (Smell Diff tab, next to Smell Type) — shown only when the case has diff_desc.md
  const ddb=document.getElementById('diffdesc-btn-sds');
  if(ddb){if(diffDescMd){ddb.style.display='inline-block';ddb.classList.add('has-data');}else{ddb.style.display='none';ddb.classList.remove('has-data');}}
  // Solve-rubrics button (Agent Diff tab Rubric) is always visible (per-case solver rubric)
  const srb=document.getElementById('rubric-btn-ads');
  if(srb){srb.style.display='inline-block';srb.classList.add('has-data');}

  // Smelly Code tab = smell.diff vs source_clean (sds)
  secState.ads={diff:ag,srcs:{},files:[],curFile:null,srcDir:'source_smelly',navIdx:-1};
  secState.sds={diff:sm,srcs:{},files:[],curFile:null,srcDir:'source_clean',navIdx:-1};

  // agent diff file list (optional; empty for generation cases)
  try{const txt=await rf(evPath(foundEv,curTrialName,'artifacts','agent_diff_files.txt'));secState.ads.files=txt.split('\n').map(s=>s.trim()).filter(Boolean);}catch{}
  secState.sds.files=extractFilesFromDiff(sm);

  await readSourceFiles('ads',foundEv,curTrialName);
  await readSourceFiles('sds',foundEv,curTrialName);
  buildFileTabs('ads');buildFileTabs('sds');

  // ensure rubric loaded (the scoring modal form depends on it)
  await loadRubricZh();
  // sync the sidebar checkbox to whatever scores this case already has
  syncDoneFromScores();
  // if the scoring modal is open, refresh it for the newly-selected case
  const scoringModal=document.getElementById('scoring-modal');
  if(scoringModal&&scoringModal.classList.contains('open')){
    renderScoringForm(document.getElementById('scoring-modal-body'));
    const sub=document.getElementById('scoring-modal-sub');if(sub)sub.textContent='· '+curTrialName;
  }

  stab('smell');
  document.getElementById('wc').style.display='none';document.getElementById('tc').style.display='block';
}

function extractFilesFromDiff(diffText){const files=[];if(!diffText)return files;for(const line of diffText.split('\n')){const m=line.match(/^diff --git a\/.+ b\/(.+)$/);if(m)files.push(m[1]);}return files;}

async function readSourceFiles(sec,evId,name){const st=secState[sec];for(const fp of st.files){try{st.srcs[fp]=await rf(evPath(evId,name,st.srcDir,...fp.split('/')));}catch(e){console.warn('Cannot read:',st.srcDir,fp,e);}}}

function evPath(evId,...parts){return directEvMode?['evaluator_'+evId,...parts]:['evaluators','evaluator_'+evId,...parts];}
async function rf(p){let d=root;for(let i=0;i<p.length-1;i++)d=await d.getDirectoryHandle(p[i]);const f=await(await d.getFileHandle(p[p.length-1])).getFile();return await f.text();}

function buildFileTabs(sec){
  const st=secState[sec];const changes=extractChangesFromDiff(st.diff);const fft=document.getElementById(sec+'-fft');fft.innerHTML='';
  st.files.forEach(fp=>{
    const ch=changes[fp]||{add:0,del:0};const hasAdd=ch.add>0,hasDel=ch.del>0;
    const dotCls=hasAdd&&hasDel?'changed':hasAdd?'added':hasDel?'deleted':'added';
    const fname=fp.split('/').pop();const tab=document.createElement('div');
    tab.className='ff-tab'+(fp===st.curFile?' on':'');tab.title=fp;
    tab.innerHTML='<span class="dot '+dotCls+'"></span>'+esc(fname);
    tab.onclick=()=>{st.curFile=fp;st.navIdx=-1;buildFileTabs(sec);renderFullFileDiff(sec);};fft.appendChild(tab);
  });
  if(!st.curFile&&st.files.length)st.curFile=st.files[0];
  if(st.curFile)renderFullFileDiff(sec);
  else if(sec==='ads'){const ads=document.getElementById('ads');if(ads)ads.innerHTML='<div style="padding:20px;color:var(--tx2);text-align:center">No agent diff for this case (generation task).</div>';}
}

// ---- Change navigation ----
function getChangeRows(container){
  const tds=container.querySelectorAll('td.d2h-ins, td.d2h-del');const seen=new Set(),rows=[];
  tds.forEach(td=>{const tr=td.parentElement;if(tr&&!seen.has(tr)){seen.add(tr);rows.push(tr);}});
  container.querySelectorAll('tr.d2h-ins, tr.d2h-del').forEach(tr=>{if(!seen.has(tr)){seen.add(tr);rows.push(tr);}});
  return rows;
}
function getChangeBlocks(container){
  const rows=getChangeRows(container);if(!rows.length)return [];const blocks=[];
  let cur={rows:[rows[0]],type:getChangeType(rows[0])};
  for(let i=1;i<rows.length;i++){const prev=rows[i-1],next=rows[i];const typ=getChangeType(next);
    if(prev.nextElementSibling===next&&typ===cur.type)cur.rows.push(next);
    else{blocks.push(cur);cur={rows:[next],type:typ};}}
  blocks.push(cur);return blocks;
}
function getChangeType(tr){if(tr.querySelector('td.d2h-ins')||tr.classList.contains('d2h-ins'))return 'add';return 'del';}

function navChange(sec,dir){
  const container=document.getElementById(sec);const blocks=getChangeBlocks(container);if(!blocks.length)return;
  const st=secState[sec];const scrollEl=document.querySelector('.main');
  const scrollMid=scrollEl.scrollTop+scrollEl.clientHeight/2;let curIdx=st.navIdx;
  if(curIdx<0){curIdx=blocks.findIndex(b=>b.rows[0].getBoundingClientRect().top>=scrollMid-50);if(curIdx<0)curIdx=blocks.length-1;}
  curIdx+=dir;if(curIdx<0)curIdx=blocks.length-1;if(curIdx>=blocks.length)curIdx=0;st.navIdx=curIdx;
  const block=blocks[curIdx];block.rows[0].scrollIntoView({behavior:'smooth',block:'center'});
  block.rows.forEach(r=>{r.style.outline='2px solid var(--ac)';r.style.outlineOffset='-2px';});
  setTimeout(()=>{block.rows.forEach(r=>{r.style.outline='';r.style.outlineOffset='';});},1500);
  const cnt=document.getElementById(sec+'-nav-count');if(cnt)cnt.textContent=(curIdx+1)+'/'+blocks.length;
}

function extractChangesFromDiff(diffText){const result={};if(!diffText)return result;let curFile=null;for(const line of diffText.split('\n')){const m=line.match(/^diff --git a\/.+ b\/(.+)$/);if(m){curFile=m[1];result[curFile]={add:0,del:0};continue;}if(!curFile)continue;if(line.startsWith('+')&&!line.startsWith('+++'))result[curFile].add++;else if(line.startsWith('-')&&!line.startsWith('---'))result[curFile].del++;}return result;}

// ---- Generate full-file diff ----
function generateFullFileDiff(filePath,srcText,origDiff){
  const hunks=[];let curFile=null,inFile=false;const lines=origDiff.split('\n');let i=0;
  while(i<lines.length){const m=lines[i].match(/^diff --git a\/.+ b\/(.+)$/);if(m){curFile=m[1];inFile=(curFile===filePath);i++;continue;}if(!inFile){i++;continue;}
    const h=lines[i].match(/^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/);if(!h){i++;continue;}
    const ops=[];i++;
    while(i<lines.length){if(lines[i].startsWith('diff --git ')||lines[i].startsWith('@@'))break;if(lines[i].startsWith('+++')||lines[i].startsWith('---')||lines[i].startsWith('index ')){i++;continue;}
      if(lines[i].startsWith('+'))ops.push({t:'+',s:lines[i].substring(1)});else if(lines[i].startsWith('-'))ops.push({t:'-',s:lines[i].substring(1)});
      else if(lines[i].startsWith('\\ ')){}else ops.push({t:' ',s:lines[i].substring(1)});i++;}
    hunks.push({oldStart:+h[1],oldCount:h[2]===undefined?1:+h[2],newStart:+h[3],newCount:h[4]===undefined?1:+h[4],ops});}
  if(!hunks.length)return '';
  // srcText is the clean (old/left) file. Expand the original injection hunks
  // with the clean lines between them, preserving the original -/+ operations.
  // The previous implementation indexed srcText with new-side line numbers,
  // effectively treating clean as the injected (right) side.
  const srcLines=srcText===''?[]:(srcText.endsWith('\n')?srcText.slice(0,-1):srcText).split('\n'),diffLines=[];let oldIdx=0,newCount=srcLines.length;
  for(const hunk of hunks){
    const hunkOldIdx=Math.max(0,hunk.oldStart-1);
    while(oldIdx<hunkOldIdx&&oldIdx<srcLines.length)diffLines.push(' '+srcLines[oldIdx++]);
    for(const op of hunk.ops){
      if(op.t==='+'){diffLines.push('+'+op.s);newCount++;continue;}
      if(op.t==='-'){diffLines.push('-'+op.s);oldIdx++;newCount--;continue;}
      diffLines.push(' '+srcLines[oldIdx]);oldIdx++;
    }
  }
  while(oldIdx<srcLines.length)diffLines.push(' '+srcLines[oldIdx++]);
  return 'diff --git a/'+filePath+' b/'+filePath+'\n--- a/'+filePath+'\n+++ b/'+filePath+'\n@@ -1,'+srcLines.length+' +1,'+newCount+' @@\n'+diffLines.join('\n')+'\n';
}

// raw hunk extraction for new-file entries (no clean baseline source)
function extractFileHunk(filePath,origDiff){
  const lines=origDiff.split('\n');let cur=null,inFile=false;const out=[];
  for(const line of lines){const m=line.match(/^diff --git a\/.+ b\/(.+)$/);if(m){cur=m[1];inFile=(cur===filePath);}if(inFile)out.push(line);}
  return out.join('\n');
}

function renderFullFileDiff(sec){
  const st=secState[sec];const container=document.getElementById(sec);
  if(!st.curFile){container.innerHTML='<div style="padding:20px;color:var(--tx2);text-align:center">'+(sec==='ads'?'No agent diff for this case (generation task).':'No files')+'</div>';return;}
  const srcText=st.srcs[st.curFile];
  let fullDiff;
  if(srcText===undefined){
    // new file: clean baseline has no source -> feed the raw hunk
    const hunk=extractFileHunk(st.curFile,st.diff);
    if(!hunk){container.innerHTML='<div style="padding:20px;color:var(--tx2);text-align:center">Source file not available: '+esc(st.curFile)+'</div>';return;}
    fullDiff=hunk;
  }else{
    fullDiff=generateFullFileDiff(st.curFile,srcText,st.diff);
  }
  try{const ui=new Diff2HtmlUI(container,fullDiff,{drawFileList:false,fileListToggle:false,fileContentToggle:false,matching:'lines',outputFormat:'side-by-side',synchronisedScroll:true,highlight:true,renderNothingWhenEmpty:false},window.hljs||undefined);ui.draw();ui.highlightCode();
    injectChangeGutter(container);
    const blocks=getChangeBlocks(container);const cnt=document.getElementById(sec+'-nav-count');if(cnt)cnt.textContent=blocks.length?'/'+blocks.length:'0';st.navIdx=-1;
  }catch(e){console.error('Full file Diff2HTML error:',e);container.innerHTML='<pre style="padding:16px;font-family:JetBrains Mono,monospace;font-size:12px;color:var(--tx2);white-space:pre-wrap;overflow-x:auto">'+esc(fullDiff)+'</pre>';}
}

// ---- Generic drawer ----
let currentDrawer=null;
function openDrawer(type){
  const drawer=document.getElementById('judge-drawer'),overlay=document.getElementById('drawer-overlay');
  const header=document.getElementById('drawer-header'),content=document.getElementById('judge-content');
  if(type==='judge'){
    header.innerHTML='<span>&#9733; 案例评判 (Case Judge)</span><button onclick="closeDrawer()">&#10005;</button>';
    renderJudgeContent(content);
  }else if(type==='prompt'){
    header.innerHTML='<span>&#128196; 任务 Prompt</span><button onclick="closeDrawer()">&#10005;</button>';
    renderPromptContent(content);
  }else if(type==='taskRubric'){
    header.innerHTML='<span>&#9878; 案例评判标准 (v6.2 中文)</span><button onclick="closeDrawer()">&#10005;</button>';
    renderCaseRubric(content);
  }else if(type==='solveRubric'){
    header.innerHTML='<span>&#9878; 本题求解 Rubric</span><button onclick="closeDrawer()">&#10005;</button>';
    renderSolveRubric(content);
  }else if(type==='smellType'){
    header.innerHTML='<span>&#128300; Smell Type</span><button onclick="closeDrawer()">&#10005;</button>';
    renderSmellTypeContent(content);
  }else if(type==='diffDesc'){
    const cpBtn=diffDescMd?'<button class="drawer-copy" onclick="copyDiffDesc()">&#128203; 复制</button>':'';
    header.innerHTML='<span>&#128203; Injection 设计说明 (diff_desc.md)</span><div style="display:flex;gap:6px;align-items:center">'+cpBtn+'<button onclick="closeDrawer()">&#10005;</button></div>';
    renderDiffDesc(content);

    header.innerHTML='<span>&#9878; Rubric</span><button onclick="closeDrawer()">&#10005;</button>';

}
function closeDrawer(){
  document.getElementById('judge-drawer').classList.remove('open');

}

  let h='';
  // summary
  const q=j.quality.score_100,d=j.difficulty.score_100,band=j.difficulty.band;
  h+='<div class="jsum"><strong>Quality '+q+'/100</strong> &middot; <strong>Difficulty '+d+'/100</strong> ('+esc(band)+' band) &middot; <strong>'+esc(j.recommendation)+'</strong><br><span style="color:var(--tx2);font-size:12px">rubric v'+esc(j.rubric_version||'?')+' &middot; '+esc(j.smell_type)+' &middot; '+esc(j.prompt_mode)+' mode</span></div>';

    h+='<div class="ri"><div class="ri-top"><span class="rn">'+fmt(dK)+' <span style="color:var(--tx2);font-size:10px">w'+w+'</span></span><span class="rs '+scoreColor(sc)+'">'+sc+'/5</span></div>';

    h+='<div class="ri"><div class="ri-top"><span class="rn">'+fmt(dK)+' <span style="color:var(--tx2);font-size:10px">w'+w+'</span></span><span class="rs '+scoreColor(sc)+'">'+sc+'/5</span></div>';

  const t=diffDescMd||'';if(!t)return;
  const done=()=>{const f=document.createElement('div');f.className='copy-flag';f.textContent='已复制 diff_desc.md';f.style.left='50%';f.style.top='62px';f.style.transform='translateX(-50%)';f.style.display='block';document.body.appendChild(f);setTimeout(()=>{f.style.opacity='0';},900);setTimeout(()=>{if(f.parentNode)f.remove();},1500);};

function renderSmellEntryDetail(){

function rScores(m){
  const q=m.quality_score_100,d=m.difficulty_score_100,sv=m.sv,pa=m.pa;
  const cq=q==null?null:(q>=80?'gn':q>=50?'og':'rd');
  const cd=d==null?null:(d>=60?'gn':d>=40?'og':'rd');
  const csv=sv==null?null:scoreColor(sv);
  const cpa=pa==null?null:scoreColor(pa);
  const cell=(l,v,c,sub)=>'<div class="scd"><div class="sl">'+l+'</div><div class="sv '+((c||'')+'')+'">'+(v!=null?v:'-')+'</div>'+(sub?'<div class="sl" style="margin-top:4px">'+sub+'</div>':'')+'</div>';
  document.getElementById('sc').innerHTML=
    cell('Quality',q!=null?q.toFixed(0):'-',cq,'/ 100')+
    cell('Difficulty',d!=null?d.toFixed(0):'-',cd,(m.difficulty_band||'')+' band')+
    cell('Smell Validity',sv!=null?sv:'-',csv,'/ 5')+
    cell('Prompt Accuracy',pa!=null?pa:'-',cpa,'/ 5');
}

// The evaluator scoring form — rendered into a given container (the modal body)
function renderScoringForm(box){
  if(!rubricZh.quality){box.innerHTML='<div style="padding:20px;color:var(--tx2);text-align:center">无法加载评分标准 rubric_zh.json</div>';return;}
  const j=judgeFull||{};
  let h='<div class="scoring">'+
    '<div class="sc-head">每个维度输入 <b>0–5</b> 分(整数)。模型分仅作参照。9 个维度全部填完且合法后,左侧复选框自动勾选。</div>'+
    '<div id="sc-summary" class="sc-summary"></div>';
  const groups=[['quality','质量 (Quality)'],['difficulty','难度 (Difficulty)']];
  for(const [gk,gtitle] of groups){
    const gd=rubricZh[gk];if(!gd||!gd.dimensions)continue;
    h+='<div class="sc-group">'+gtitle+'</div>';
    h+='<table class="score-tbl"><thead><tr><th class="th-dim">维度</th><th class="th-model">模型</th><th class="th-inp">你的打分</th></tr></thead><tbody>';
    for(const [dk,dm] of Object.entries(gd.dimensions)){
      const ms=j[gk]&&j[gk].dimensions&&j[gk].dimensions[dk]!=null?j[gk].dimensions[dk].score:null;
      const cur=getScore(gk,dk);
      const rules=(dm.score_rules_zh||{});
      const ruleKeys=Object.keys(rules).sort((a,b)=>+a-+b);
const tipText=dm.name_zh+' (权重 '+dm.weight+')\n'+(dm.explanation_zh||'')+'\n'+ruleKeys.map(s=>s+' 分: '+rules[s]).join('\n');
      const tip='<span class="qmark" data-tip-type="dim" data-group="'+gk+'" data-dim="'+dk+'" data-copy-text="'+esc(tipText)+'">?</span>';
      const ev=(j[gk]&&j[gk].dimensions&&j[gk].dimensions[dk])?j[gk].dimensions[dk].evidence:'';
      const evText=(dm.name_zh||dk)+' · 模型评分依据\n'+ev;
      const evTip=ev?('<span class="qmark" data-tip-type="ev" data-group="'+gk+'" data-dim="'+dk+'" data-copy-text="'+esc(evText)+'">?</span>'):'';
      h+='<tr>'+
        '<td class="td-dim"><div class="dim-n">'+esc(dm.name_zh||dk)+tip+'</div><div class="dim-en">'+esc(dk)+'</div></td>'+
        '<td class="td-model">'+(ms!=null?'<span class="mchip '+scoreColor(ms)+'">'+ms+'</span>'+evTip:'—')+'</td>'+
        '<td class="td-inp"><input type="number" min="0" max="5" step="1" inputmode="numeric" class="score-in" data-group="'+gk+'" data-dim="'+dk+'" value="'+(cur!=null?cur:'')+'"></td>'+
        '</tr>';
    }
    h+='</tbody></table>';
  }
  h+='</div>';
  box.innerHTML=h;
  if(!box._scoringBound){box.addEventListener('input',onScoreInput);box.addEventListener('change',onScoreInput);box._scoringBound=true;}
  // attach Tippy tooltips to every "?". hover shows the tooltip; click copies its plain text.
  box.querySelectorAll('.qmark').forEach(qm=>{
    const tipHTML=buildTipHTML(qm.getAttribute('data-tip-type'),qm.getAttribute('data-group'),qm.getAttribute('data-dim'));
    if(window.tippy){
      qm._tippy=tippy(qm,{content:tipHTML,allowHTML:true,interactive:true,trigger:'mouseenter focus',placement:'right',theme:'smellbench',maxWidth:460,delay:[80,0],animation:false,appendTo:document.body});
    }
    qm.addEventListener('click',(e)=>{e.stopPropagation();copyTip(qm);});
  });
  updateScoringSummary();
}
function buildTipHTML(type,gk,dk){
  const gd=rubricZh[gk]&&rubricZh[gk].dimensions?rubricZh[gk].dimensions[dk]:null;
  if(!gd)return '';
  if(type==='dim'){
    const rules=gd.score_rules_zh||{};const ruleKeys=Object.keys(rules).sort((a,b)=>+a-+b);
    return '<div class="tip-t">'+esc(gd.name_zh||dk)+' <span class="tip-w">(权重 '+gd.weight+')</span></div>'+
      '<div class="tip-e">'+esc(gd.explanation_zh||'')+'</div>'+
      '<div class="tip-r">'+ruleKeys.map(s=>'<div><b>'+s+' 分</b> · '+esc(rules[s])+'</div>').join('')+'</div>';
  }
  // type === 'ev' : show the model judge's evidence for this dimension
  const ev=(judgeFull&&judgeFull[gk]&&judgeFull[gk].dimensions&&judgeFull[gk].dimensions[dk])?judgeFull[gk].dimensions[dk].evidence:'';
  return '<div class="tip-t">'+esc(gd.name_zh||dk)+' · 模型评分依据</div><div class="tip-e">'+esc(ev)+'</div>';
}
function copyTip(qm){
  const raw=qm.getAttribute('data-copy-text');if(raw==null)return;
  const ta=document.createElement('textarea');ta.innerHTML=raw;const text=ta.value;
  const done=()=>showCopied(qm);
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));}
  else{fallbackCopy(text,done);}
}
function fallbackCopy(text,cb){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.top='-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);cb();}
function showCopied(anchor){
  const f=document.createElement('div');f.className='copy-flag';f.textContent='已复制';
  const r=anchor.getBoundingClientRect();
  f.style.left=Math.max(8,r.right+4)+'px';f.style.top=Math.max(8,r.top-6)+'px';
  document.body.appendChild(f);f.style.display='block';
  setTimeout(()=>{f.style.opacity='0';},900);setTimeout(()=>{if(f.parentNode)f.remove();},1500);
}

function onScoreInput(e){

function pickResultsFile(){
  if(!root||!curEv){alert('请先选择目录和 evaluator');return;}
  const input=document.getElementById('results-import');input.value='';input.click();
}
async function importResultsFile(event){
  const file=event.target.files&&event.target.files[0];if(!file)return;
  let data;try{data=JSON.parse(await file.text());}catch(e){alert('导入失败：不是有效的 JSON 文件');return;}
  const rows=Array.isArray(data)?data:data.cases;if(!Array.isArray(rows)){alert('导入失败：JSON 中缺少 cases 数组');return;}
  const idx=indexCache[curEv]||{},trials=(idx.trials&&idx.trials.length?idx.trials:idx.tasks)||[];
  const allowed=new Set(trials.map(t=>t.trial_name||t.task_id));let imported=0,skipped=0,emptySkipped=0;
  const cleanGroup=(src,group)=>{const out={};if(!src||typeof src!=='object'||!rubricZh[group])return out;for(const dk of Object.keys(rubricZh[group].dimensions)){const v=src[dk];if(Number.isInteger(v)&&v>=0&&v<=5)out[dk]=v;}return out;};
  for(const row of rows){
    const name=row&&(row.trial||row.trial_name||row.task_id);if(!name||!allowed.has(name)){skipped++;continue;}
    const quality=cleanGroup(row.quality,'quality'),difficulty=cleanGroup(row.difficulty_dims||row.difficulty_scores,'difficulty');
    if(!Object.keys(quality).length&&!Object.keys(difficulty).length){emptySkipped++;continue;}
    // Only non-empty imported dimensions overwrite the selected evaluator.
    // Empty groups/dimensions preserve the existing score; other evaluator
    // keys and the legacy unscoped key are never touched.
    const key=scoreKey(curEv,name),existing=evalScores[key]||{quality:{},difficulty:{}};
    evalScores[key]={quality:{...(existing.quality||{}),...quality},difficulty:{...(existing.difficulty||{}),...difficulty},_updated_at:Date.now()};
    imported++;
  }
  await saveEvalScores();rebuildDoneFromScores();buildList(curEv);
  if(curTrialName&&document.getElementById('scoring-modal').classList.contains('open'))renderScoringForm(document.getElementById('scoring-modal-body'));
  updateFab();alert('导入完成：更新当前 E'+curEv+' 的 '+imported+' 个 case'+(emptySkipped?'，保留 '+emptySkipped+' 个空评分 case 的原记录':'')+(skipped?'，跳过 '+skipped+' 个不属于当前 evaluator 的条目':'')+'。');
}

// Collect the current evaluator's annotation results (evalScores) into a JSON file and download it.
async function collectResults(){
  if(!curEv){alert('请先选择目录并加载数据');return;}
  await saveEvalScores();
  const idx=indexCache[curEv]||{};const trials=(idx.trials&&idx.trials.length?idx.trials:idx.tasks)||[];
  const prefix=curEv+'::';
  const cases=[];
  for(const t of trials){
    ensureScoreFor(curEv,t.trial_name);
    const s=evalScores[prefix+t.trial_name];
    const rec={trial:t.trial_name,task_id:t.task_id,repo:t.repo,language:t.language,smell_type:t.smell_type,
      difficulty:t.difficulty,quality:(s&&s.quality)||{},difficulty_dims:(s&&s.difficulty)||{},
      quality_score_100:null,difficulty_score_100:null,all_scored:false};
    let q100=null,d100=null,qAll=true,dAll=true,qt=0,dt=0;
    if(rubricZh.quality&&rubricZh.difficulty){
      for(const[dk,dm]of Object.entries(rubricZh.quality.dimensions)){const v=(s&&s.quality&&s.quality[dk]);if(v==null)qAll=false;else qt+=dm.weight*v/5;}
      for(const[dk,dm]of Object.entries(rubricZh.difficulty.dimensions)){const v=(s&&s.difficulty&&s.difficulty[dk]);if(v==null)dAll=false;else dt+=dm.weight*v/5;}
      if(qAll)q100=Math.round(qt);if(dAll)d100=Math.round(dt);
      rec.all_scored=!!(qAll&&dAll);
    }
    rec.quality_score_100=q100;rec.difficulty_score_100=d100;
    cases.push(rec);
  }
  await saveEvalScores();
  const scoredCases=cases.filter(c=>c.all_scored).length;
  const out={evaluator_id:curEv,schema_version:rubricZh.schema_version||null,protocol_version:rubricZh.protocol_version||null,collected_cases:cases.length,scored_cases:scoredCases,incomplete_cases:cases.length-scoredCases,cases:cases};
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='evaluator_'+curEv+'_results.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);
}

// ---- Change gutter ----
function injectChangeGutter(container){const wrapper=container.querySelector('.d2h-file-wrapper');if(!wrapper)return;wrapper.style.position='relative';
  const old=wrapper.querySelector('.ff-gutter');if(old)old.remove();const gutter=document.createElement('div');gutter.className='ff-gutter';
  const wrapperH=wrapper.scrollHeight;if(wrapperH<=0)return;
  const rows=getChangeRows(container);const seen=new Set();
  rows.forEach(row=>{if(seen.has(row))return;seen.add(row);const top=row.offsetTop;const h=row.offsetHeight;
    const pctTop=top/wrapperH*100;const pctH=Math.max(h/wrapperH*100,0.15);
    const hasAdd=!!row.querySelector('td.d2h-ins')||row.classList.contains('d2h-ins');
    const hasDel=!!row.querySelector('td.d2h-del')||row.classList.contains('d2h-del');
    const cls=hasAdd&&hasDel?'add':hasAdd?'add':'del';
    const mk=document.createElement('div');mk.className='mk '+cls;mk.style.top=pctTop+'%';mk.style.height=pctH+'%';
    mk.title=hasAdd?'Added line':'Deleted line';
    mk.onclick=()=>{row.scrollIntoView({behavior:'smooth',block:'center'});row.style.outline='2px solid var(--ac)';row.style.outlineOffset='-2px';setTimeout(()=>{row.style.outline='';row.style.outlineOffset='';},1500);};
    gutter.appendChild(mk);});wrapper.appendChild(gutter);}
